<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="assessProGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="40%" stop-color="#1d72fe" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="capAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#assessProGrad)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="rgba(255,255,255,0.28)" stroke-width="1" />

  <!-- Graduation Cap (Mortarboard) -->
  <polygon points="32,13 52,23 32,33 12,23" fill="url(#capAccent)" />
  
  <!-- Lower Skullcap Arc -->
  <path d="M19,27 L19,36 C19,41 24.8,44 32,44 C39.2,44 45,41 45,36 L45,27 L32,33.5 Z" fill="#ffffff" fill-opacity="0.9" />
  
  <!-- Tassel -->
  <path d="M49,24.5 L50.5,35" stroke="#facc15" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="50.5" cy="37" r="2" fill="#facc15" />

  <!-- Assessment Checkmark Accent badge at base -->
  <path d="M23,49 L29,54 L43,39" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>